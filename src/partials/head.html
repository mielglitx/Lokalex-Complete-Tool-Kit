<!-- THEME INITIALIZATION SCRIPT (ENFORCES LIGHT THEME BY DEFAULT) -->
<script>
    (function() {
        try {
            const v3Flag = localStorage.getItem('lokalex_light_theme_enforced_v3');
            if (!v3Flag) {
                localStorage.setItem('lokalex_theme', 'light');
                localStorage.setItem('lokalex_theme_preference', 'light');
                localStorage.setItem('lokalex_light_theme_enforced_v3', 'true');
            }
        } catch (e) {}

        let savedTheme = localStorage.getItem('lokalex_theme') || localStorage.getItem('lokalex_theme_preference') || 'light';
        if (savedTheme === 'system') savedTheme = 'light';
        
        const isDark = savedTheme === 'dark';
        const root = document.documentElement;
        if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.backgroundColor = '#0C1814';
            root.style.colorScheme = 'dark';
        } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.backgroundColor = '#EDF7F2';
            root.style.colorScheme = 'light';
        }
        if (document.body) {
            document.body.style.backgroundColor = isDark ? '#0C1814' : '#EDF7F2';
            document.body.style.color = isDark ? '#F8FAFC' : '#0F172A';
        }
    })();
</script>
