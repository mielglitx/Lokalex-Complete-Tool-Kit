<!-- THEME INITIALIZATION SCRIPT (PREVENTS FLASH OF UNSTYLED THEME ON LOAD) -->
<script>
    (function() {
        const savedTheme = localStorage.getItem('lokalex_theme_preference') || 'system';
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme === 'dark' || (savedTheme === 'system' && systemPrefersDark);
        
        if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
        }
    })();
</script>

<!-- THEME DYNAMIC CSS VARIABLES & SHADOW REMOVAL -->
<style>
    :root {
        --color-darkBg: #F8FAFC;
        --color-cardBg: #FFFFFF;
        --color-inputBg: #F1F5F9;
        --color-textMain: #0F172A;
        --color-textMuted: #64748B;
        --color-border: #E2E8F0;
    }
    html.dark {
        --color-darkBg: #121212;
        --color-cardBg: #1E1E1E;
        --color-inputBg: #2A2A2A;
        --color-textMain: #F9FAFB;
        --color-textMuted: #9CA3AF;
        --color-border: #27272A;
    }
    *, ::before, ::after {
        box-shadow: none !important;
        text-shadow: none !important;
    }
    body {
        background-color: var(--color-darkBg);
        color: var(--color-textMain);
        transition: background-color 0.2s ease, color 0.2s ease;
    }
    .bg-darkBg { background-color: var(--color-darkBg) !important; }
    .bg-cardBg { background-color: var(--color-cardBg) !important; }
    .bg-inputBg { background-color: var(--color-inputBg) !important; }
</style>
