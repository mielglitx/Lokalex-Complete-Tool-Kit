<header id="app-header" class="hidden bg-cardBg px-4 py-3.5 flex items-center justify-between shadow-md sticky top-0 z-40 border-b border-gray-800/80">
    <button id="back-btn" onclick="window.goBack && window.goBack()" class="hidden text-blue-400 font-semibold flex items-center gap-1.5 transition active:scale-95 text-xs">
        <i class="fa-solid fa-arrow-left"></i> Back
    </button>
    <h1 id="header-title" class="text-base font-bold tracking-wide flex items-center gap-1.5">
        L<i class="fa-solid fa-location-dot text-red-500"></i>kalex Hub
    </h1>
    
    <div class="flex items-center gap-2">
        <div id="network-status-pill" class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full shadow-sm transition-all duration-300">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="network-status-text">ONLINE</span>
        </div>
    </div>
</header>
