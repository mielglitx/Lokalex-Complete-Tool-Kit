<!-- src/partials/header.html -->
<header id="app-header" class="hidden bg-cardBg px-3.5 py-2.5 flex items-center justify-between sticky top-0 z-40 border-b border-gray-200 dark:border-gray-800/80 shadow-xs">
    <!-- LEFT: BACK BUTTON (When navigating) OR RIDER WELCOME AVATAR (When on Home) -->
    <div class="flex items-center gap-2 min-w-0">
        <button id="back-btn" onclick="window.goBack && window.goBack()" class="hidden text-blue-600 dark:text-blue-400 font-semibold flex items-center gap-1.5 transition active:scale-95 text-xs py-1 px-2 rounded-lg bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800/50 shrink-0">
            <i class="fa-solid fa-arrow-left"></i> Back
        </button>

        <!-- RIDER PROFILE & WELCOME GREETING -->
        <div id="header-user-section" onclick="window.openAvatarPickerModal && window.openAvatarPickerModal()" class="flex items-center gap-2 min-w-0 cursor-pointer group transition active:scale-95" title="Click to change profile picture">
            <div class="relative shrink-0">
                <img id="header-user-avatar" src="https://ui-avatars.com/api/?name=Rider&background=0284c7&color=ffffff&bold=true&size=128" alt="Profile" class="w-8 h-8 rounded-full object-cover border-2 border-emerald-500 shadow-sm group-hover:border-emerald-400 transition">
                <span class="absolute -bottom-1 -right-1 bg-gray-900 text-gray-300 group-hover:text-white rounded-full p-0.5 text-[8px] border border-gray-700 shadow flex items-center justify-center w-3.5 h-3.5">
                    <i class="fa-solid fa-camera"></i>
                </span>
            </div>
            <div class="flex flex-col min-w-0">
                <span class="text-[9px] text-gray-400 uppercase tracking-wider font-bold leading-none">Welcome!</span>
                <span id="header-user-name" class="text-xs font-black text-gray-900 dark:text-white truncate max-w-[120px] sm:max-w-[160px] leading-tight group-hover:text-emerald-400 transition">Rider</span>
            </div>
        </div>
    </div>

    <!-- RIGHT: THEME CONTROLS & ONLINE PILL -->
    <div class="flex items-center gap-1.5 shrink-0">
        <!-- 3-WAY THEME CONTROLLER TOGGLE (LIGHT / SYSTEM / DARK) -->
        <div id="theme-switch-group" class="flex items-center bg-gray-100 dark:bg-black/40 border border-gray-300 dark:border-gray-700/60 p-0.5 rounded-xl text-xs shrink-0">
            <button type="button" onclick="window.setTheme && window.setTheme('light')" id="theme-btn-light" title="Light Theme" class="w-6 h-6 rounded-lg flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-amber-500 transition active:scale-90">
                <i class="fa-solid fa-sun text-[10px]"></i>
            </button>
            <button type="button" onclick="window.setTheme && window.setTheme('system')" id="theme-btn-system" title="System Auto Theme (Default)" class="w-6 h-6 rounded-lg flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-blue-500 transition active:scale-90">
                <i class="fa-solid fa-desktop text-[10px]"></i>
            </button>
            <button type="button" onclick="window.setTheme && window.setTheme('dark')" id="theme-btn-dark" title="Dark Theme" class="w-6 h-6 rounded-lg flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-indigo-400 transition active:scale-90">
                <i class="fa-solid fa-moon text-[10px]"></i>
            </button>
        </div>

        <!-- NETWORK STATUS PILL -->
        <div id="network-status-pill" class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 text-[10px] font-bold px-2 py-1 rounded-full transition-all duration-300 shrink-0">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="network-status-text">ONLINE</span>
        </div>
    </div>
</header>
