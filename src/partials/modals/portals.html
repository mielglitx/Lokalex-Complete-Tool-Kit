<!-- 1. MAP CALCULATION PORTAL (?mapcalc=KEY) -->
<div id="mapcalc-customer-portal" class="hidden fixed inset-0 bg-darkBg z-[99999] flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
    <div class="bg-cardBg border border-emerald-500/40 p-5 rounded-3xl max-w-sm w-full shadow-2xl flex flex-col gap-3 my-auto relative">
        <div class="w-14 h-12 bg-emerald-600/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shrink-0">
            <i class="fa-solid fa-route animate-pulse"></i>
        </div>
        <h2 class="text-xl font-black text-white">L<i class="fa-solid fa-location-dot text-red-500"></i>kalex Distance Calc</h2>
        
        <div id="mapcalc-cust-map-box" class="hidden w-full h-40 rounded-2xl overflow-hidden border border-emerald-500/50 relative my-1 shadow-inner">
            <div id="mapcalc-cust-google-map" class="w-full h-full"></div>
        </div>

        <div id="mapcalc-cust-status" class="text-xs font-bold text-amber-400 bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">
            Pindutin ang green button sa ibaba para ma-pin ang iyong lokasyon.
        </div>

        <button id="mapcalc-cust-btn" onclick="window.startMapCalcLocationSharing && window.startMapCalcLocationSharing()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-xl transition active:scale-95 text-sm flex justify-center items-center gap-2 ring-2 ring-emerald-400/50">
            <i class="fa-solid fa-location-arrow text-base"></i> SHARE LOCATION FOR DISTANCE CALC
        </button>
    </div>
</div>

<!-- 2. STANDARD LIVE TRACKING PORTAL (?track=KEY) -->
<div id="customer-tracking-portal" class="hidden fixed inset-0 bg-darkBg z-[99999] flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
    <div class="bg-cardBg border border-blue-500/40 p-5 rounded-3xl max-w-sm w-full shadow-2xl flex flex-col gap-3 my-auto relative">
        <div class="w-14 h-12 bg-blue-600/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shrink-0">
            <i class="fa-solid fa-location-crosshairs animate-pulse"></i>
        </div>
        <h2 class="text-xl font-black text-white">L<i class="fa-solid fa-location-dot text-red-500"></i>kalex Delivery Tracking</h2>

        <div id="cust-map-container-box" class="hidden w-full h-40 rounded-2xl overflow-hidden border border-blue-500/50 relative my-1 shadow-inner">
            <div id="cust-google-map" class="w-full h-full"></div>
        </div>

        <div id="cust-share-status" class="text-xs font-bold text-amber-400 bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">
            Pindutin ang blue button sa ibaba para i-pin ang iyong kinaroroonan.
        </div>

        <button id="cust-share-btn" onclick="window.startCustomerLocationSharing && window.startCustomerLocationSharing()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-xl transition active:scale-95 text-sm flex justify-center items-center gap-2 ring-2 ring-blue-400/50">
            <i class="fa-solid fa-paper-plane text-base"></i> SHARE MY LOCATION
        </button>
    </div>
</div>

<!-- 3. MUTUAL LIVE GPS TRACKER PORTAL (?livegps=KEY) -->
<div id="livegps-portal" class="hidden fixed inset-0 bg-darkBg z-[99999] flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
    <div class="bg-cardBg border border-indigo-500/40 p-5 rounded-3xl max-w-sm w-full shadow-2xl flex flex-col gap-3 my-auto relative">
        <div class="absolute top-4 left-4">
            <button id="livegps-rider-close-btn" onclick="window.closeRiderLiveMap && window.closeRiderLiveMap()" class="hidden bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition active:scale-95 flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
        </div>

        <div class="w-14 h-12 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shrink-0 mt-6 sm:mt-0">
            <i class="fa-solid fa-satellite-dish animate-pulse"></i>
        </div>
        <h2 class="text-xl font-black text-white">L<i class="fa-solid fa-location-dot text-red-500"></i>kalex Live Tracker</h2>

        <div id="livegps-map-container-box" class="w-full h-56 sm:h-64 rounded-2xl overflow-hidden border border-indigo-500/50 relative my-1 shadow-inner">
            <div id="livegps-map-container" class="w-full h-full"></div>
        </div>

        <div id="livegps-customer-controls" class="w-full flex flex-col gap-3 mt-1">
            <button id="livegps-share-btn" onclick="window.startMutualCustomerLocationSharing && window.startMutualCustomerLocationSharing()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-2xl shadow-xl transition active:scale-95 text-sm flex justify-center items-center gap-2 ring-2 ring-indigo-400/50">
                <i class="fa-solid fa-satellite-dish text-base"></i> JOIN LIVE TRACKING
            </button>
        </div>
    </div>
</div>
