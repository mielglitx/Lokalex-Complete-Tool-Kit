<!-- src/partials/modals/rider-password-modal.html -->
<div id="rider-password-setup-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
    <div class="bg-cardBg border border-gray-200 dark:border-gray-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col gap-4 relative">
        <!-- HEADER -->
        <div class="flex items-center justify-between pb-2 border-b border-gray-100 dark:border-gray-800">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-500 text-sm shrink-0">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-sm text-gray-900 dark:text-white">Account Security Setup</h3>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400">Verify mobile number & set password</p>
                </div>
            </div>
            <button type="button" onclick="window.closeRiderPasswordSetupModal && window.closeRiderPasswordSetupModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white p-1 text-sm transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- NOTICE -->
        <div class="bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800/60 rounded-2xl p-3 flex items-start gap-2.5">
            <i class="fa-solid fa-circle-info text-blue-500 text-xs mt-0.5 shrink-0"></i>
            <p class="text-[11px] text-blue-900 dark:text-blue-300 font-medium leading-snug">
                Kinakailangan mag-rehistro ng Mobile Number at mag-set ng bagong password gamit ang SMS OTP bago makapag-duty.
            </p>
        </div>

        <!-- STEP 1: PHONE NUMBER & SMS OTP VERIFICATION -->
        <div id="rider-setup-step-phone" class="flex flex-col gap-2.5">
            <div class="flex flex-col gap-1">
                <label class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 flex items-center gap-1">
                    <i class="fa-solid fa-phone text-emerald-500"></i> Required Mobile Number:
                </label>
                <div class="flex gap-2">
                    <input type="tel" id="rider-setup-phone-input" placeholder="09xxxxxxxxx or +639xxxxxxxxx" class="flex-1 bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white font-mono">
                    <button type="button" id="rider-setup-send-otp-btn" onclick="window.sendRiderSetupOTP && window.sendRiderSetupOTP()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2.5 rounded-xl text-xs font-bold transition active:scale-95 shrink-0 shadow-xs flex items-center gap-1">
                        <i class="fa-solid fa-paper-plane"></i> Send OTP
                    </button>
                </div>
            </div>

            <!-- OTP CODE ENTRY BOX -->
            <div id="rider-setup-otp-box" class="hidden flex flex-col gap-1.5 p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-500/40 animate-fade-in">
                <label class="text-[10px] font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 flex items-center gap-1">
                    <i class="fa-solid fa-key"></i> Enter 6-Digit SMS Code:
                </label>
                <div class="flex gap-2">
                    <input type="text" id="rider-setup-otp-code" maxlength="6" placeholder="123456" class="flex-1 bg-white dark:bg-black/60 text-center tracking-[0.4em] text-sm font-black rounded-xl p-2 border border-emerald-400 outline-none text-gray-900 dark:text-white font-mono">
                    <button type="button" id="rider-setup-verify-otp-btn" onclick="window.verifyRiderSetupOTP && window.verifyRiderSetupOTP()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition active:scale-95 shrink-0 shadow-xs flex items-center gap-1">
                        <i class="fa-solid fa-check-double"></i> Verify
                    </button>
                </div>
            </div>

            <div id="rider-phone-verified-badge" class="hidden p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 dark:text-emerald-400 text-xs font-bold flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-sm"></i> Mobile number verified via OTP!
            </div>
        </div>

        <!-- STEP 2: PASSWORD CREATION -->
        <div id="rider-setup-step-pass" class="flex flex-col gap-2.5 pt-2 border-t border-gray-100 dark:border-gray-800 opacity-50 pointer-events-none transition-all duration-300">
            <div class="flex flex-col gap-1">
                <label class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">New Password (min 4 characters)</label>
                <div class="relative">
                    <input type="password" id="rider-new-pass-1" placeholder="Enter password" class="w-full bg-inputBg text-xs rounded-xl p-2.5 pr-9 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white font-mono">
                    <button type="button" onclick="window.toggleRiderPassVisibility && window.toggleRiderPassVisibility('rider-new-pass-1', this)" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-white text-xs">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Confirm Password (type again)</label>
                <div class="relative">
                    <input type="password" id="rider-new-pass-2" placeholder="Re-type password to verify" class="w-full bg-inputBg text-xs rounded-xl p-2.5 pr-9 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white font-mono">
                    <button type="button" onclick="window.toggleRiderPassVisibility && window.toggleRiderPassVisibility('rider-new-pass-2', this)" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-white text-xs">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="rider-pass-error-msg" class="hidden text-[11px] font-bold text-red-500 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="rider-pass-error-text">Passwords do not match.</span>
            </div>
        </div>

        <!-- DEDICATED RIDER RECAPTCHA CONTAINER -->
        <div id="rider-recaptcha-container"></div>

        <!-- ACTIONS -->
        <div class="flex items-center justify-between gap-2 pt-2 border-t border-gray-100 dark:border-gray-800">
            <button type="button" onclick="window.handleSkipRiderPasswordSetup && window.handleSkipRiderPasswordSetup()" class="px-3.5 py-2.5 rounded-xl text-xs font-bold text-amber-500 hover:text-amber-400 bg-amber-500/10 border border-amber-500/30 transition active:scale-95 flex items-center gap-1" title="Skip password creation for now">
                <i class="fa-solid fa-forward"></i> Skip
            </button>

            <div class="flex items-center gap-2">
                <button type="button" onclick="window.closeRiderPasswordSetupModal && window.closeRiderPasswordSetupModal()" class="px-3 py-2 rounded-xl text-xs font-bold text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition">
                    Cancel
                </button>
                <button type="button" id="rider-setup-save-btn" disabled onclick="window.handleSaveRiderPassword && window.handleSaveRiderPassword()" class="bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-md transition active:scale-95 flex items-center gap-1.5">
                    <i class="fa-solid fa-check"></i> Save & Continue
                </button>
            </div>
        </div>
    </div>
</div>
