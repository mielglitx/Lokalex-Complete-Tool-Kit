<!-- src/partials/modals/system-dialogs/cater-modals.html -->

<!-- CATERING PROMPT MODAL -->
<div id="catering-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-cardBg border border-gray-200 dark:border-gray-800 p-6 rounded-2xl w-full max-w-xs shadow-2xl flex flex-col gap-4 text-gray-900 dark:text-white">
        <h3 class="font-bold text-base text-center text-red-600 dark:text-red-400 flex items-center justify-center gap-2">
            <i class="fa-solid fa-motorcycle"></i> Start Catering
        </h3>
        <div class="flex flex-col gap-2.5 text-left">
            <div>
                <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase block mb-1">Select Customer (Inbox)</label>
                <select id="catering-customer-select" onchange="if(this.value) document.getElementById('catering-customer-name').value = this.value;" class="w-full bg-inputBg text-xs rounded-lg p-2.5 outline-none border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white font-bold">
                    <option value="">-- Select Active Customer --</option>
                </select>
            </div>

            <!-- OCR SCREENSHOT AUTO-FILL BUTTON -->
            <div class="pt-1">
                <input type="file" id="cater-chat-screenshot-input" accept="image/*" class="hidden" onchange="window.handleCaterScreenshotSelected && window.handleCaterScreenshotSelected(event, 'catering-customer-name', 'catering-customer-select', 'cater-ocr-status')">
                <button type="button" onclick="document.getElementById('cater-chat-screenshot-input').click()" class="w-full bg-blue-50 hover:bg-blue-100 dark:bg-blue-600/20 dark:hover:bg-blue-600/30 text-blue-600 dark:text-blue-400 py-2 px-3 rounded-xl font-bold text-xs transition border border-blue-200 dark:border-blue-500/30 flex items-center justify-center gap-1.5 shadow-xs active:scale-95">
                    <i class="fa-solid fa-camera"></i> Scan Name from Screenshot
                </button>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Customer Name</label>
                    <span id="cater-ocr-status" class="hidden text-[9px] text-blue-500 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-spinner fa-spin"></i> Reading name...
                    </span>
                </div>
                <input type="text" id="catering-customer-name" autocomplete="off" placeholder="Enter customer name..." class="w-full bg-inputBg text-sm rounded-lg p-2.5 outline-none border border-gray-300 dark:border-gray-700 focus:border-blue-500 text-gray-900 dark:text-white font-bold">
            </div>
        </div>
        <div class="flex gap-2 mt-2">
            <button onclick="window.closeCateringModal && window.closeCateringModal()" class="flex-1 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 py-2.5 rounded-xl text-xs font-bold text-gray-700 dark:text-gray-300 transition active:scale-95">Cancel</button>
            <button onclick="window.confirmCateringStatus && window.confirmCateringStatus()" class="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl text-xs font-bold text-white transition active:scale-95 shadow">Start</button>
        </div>
    </div>
</div>

<!-- FIRST IN LINE QUEUE NOTIFICATION MODAL -->
<div id="first-in-line-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-[99999] flex items-center justify-center p-4">
    <div class="bg-cardBg border-2 border-emerald-500 p-6 rounded-3xl w-full max-w-xs shadow-2xl text-center flex flex-col gap-4 animate-bounce">
        <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner border border-emerald-500/40">
            <i class="fa-solid fa-bell"></i>
        </div>
        <div>
            <h3 class="font-black text-lg text-emerald-400">IKAW NA ANG SUNOD!</h3>
            <p class="text-xs text-gray-200 mt-2 leading-relaxed">
                You are currently <strong>#1 First in Line</strong> in the queue. Prepare for incoming catering orders!
            </p>
        </div>
        <button onclick="window.dismissQueueAlarm && window.dismissQueueAlarm()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg transition active:scale-95 text-xs flex items-center justify-center gap-2 ring-2 ring-emerald-400/50">
            <i class="fa-solid fa-volume-xmark"></i> ACKNOWLEDGE & STOP ALARM
        </button>
    </div>
</div>
