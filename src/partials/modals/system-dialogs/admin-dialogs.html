<!-- src/partials/modals/system-dialogs/admin-dialogs.html -->

<!-- ADMIN FORCE CATERING MODAL -->
<div id="admin-catering-modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-[99999] flex items-center justify-center p-4">
    <div class="bg-cardBg border border-gray-200 dark:border-gray-800 p-6 rounded-3xl w-full max-w-xs shadow-2xl flex flex-col gap-3.5 text-gray-900 dark:text-white">
        <h3 class="font-black text-base text-center text-red-600 dark:text-red-400 flex items-center justify-center gap-2">
            <i class="fa-solid fa-motorcycle"></i> Force Cater Order
        </h3>

        <input type="hidden" id="admin-cater-target-rider-id" value="">
        <input type="hidden" id="admin-cater-target-rider-name" value="">

        <div class="flex flex-col gap-2.5 text-left text-xs">
            <div>
                <label class="text-[10px] text-gray-600 dark:text-gray-400 font-bold uppercase tracking-wider block mb-1">Select Customer (Inbox)</label>
                <select id="admin-cater-customer-select" onchange="if(this.value) document.getElementById('admin-cater-cust-name').value = this.value;" class="w-full bg-inputBg text-xs rounded-xl p-2.5 outline-none border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white font-bold">
                    <option value="">-- Select Active Customer --</option>
                </select>
            </div>

            <!-- OCR SCREENSHOT AUTO-FILL BUTTON FOR ADMIN -->
            <div class="pt-1">
                <input type="file" id="admin-cater-chat-screenshot-input" accept="image/*" class="hidden" onchange="window.handleCaterScreenshotSelected && window.handleCaterScreenshotSelected(event, 'admin-cater-cust-name', 'admin-cater-customer-select', 'admin-cater-ocr-status')">
                <button type="button" onclick="document.getElementById('admin-cater-chat-screenshot-input').click()" class="w-full bg-blue-50 hover:bg-blue-100 dark:bg-blue-600/20 dark:hover:bg-blue-600/30 text-blue-600 dark:text-blue-400 py-1.5 px-3 rounded-xl font-bold text-[11px] transition border border-blue-200 dark:border-blue-500/30 flex items-center justify-center gap-1.5 shadow-xs active:scale-95">
                    <i class="fa-solid fa-camera"></i> Scan Name from Screenshot
                </button>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[10px] text-gray-600 dark:text-gray-400 font-bold uppercase tracking-wider block">Customer Name</label>
                    <span id="admin-cater-ocr-status" class="hidden text-[9px] text-blue-500 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-spinner fa-spin"></i> Reading name...
                    </span>
                </div>
                <input type="text" id="admin-cater-cust-name" autocomplete="off" autocorrect="off" placeholder="Enter customer name..." class="w-full bg-inputBg text-xs rounded-xl p-2.5 outline-none border border-gray-300 dark:border-gray-700 focus:border-blue-500 text-gray-900 dark:text-white font-bold">
            </div>

            <div class="pt-1">
                <label class="text-[10px] text-amber-600 dark:text-amber-400 font-bold uppercase tracking-wider flex items-center gap-1 mb-1">
                    <i class="fa-solid fa-hourglass-half"></i> Penalty Cooldown (After Delivery)
                </label>
                <select id="admin-cater-penalty-select" class="w-full bg-inputBg text-xs rounded-xl p-2.5 outline-none border border-amber-500/40 text-amber-700 dark:text-amber-300 font-bold">
                    <option value="0" selected>No Penalty (Standard Delivery)</option>
                    <option value="5">5 Minutes Penalty Cooldown</option>
                    <option value="10">10 Minutes Penalty Cooldown</option>
                    <option value="15">15 Minutes Penalty Cooldown</option>
                    <option value="20">20 Minutes Penalty Cooldown</option>
                    <option value="30">30 Minutes Penalty Cooldown</option>
                    <option value="60">60 Minutes Penalty Cooldown</option>
                </select>
                <p class="text-[9px] text-gray-500 dark:text-gray-400 mt-1 italic">
                    Kapag may penalty, awtomatikong mag-co-cooldown ang rider bago muling maging Available pagkatapos ng biyahe.
                </p>
            </div>
        </div>

        <div class="flex gap-2 mt-1">
            <button type="button" onclick="window.closeAdminCateringModal && window.closeAdminCateringModal()" class="flex-1 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 py-2.5 rounded-xl text-xs font-bold text-gray-700 dark:text-gray-300 transition active:scale-95">Cancel</button>
            <button type="button" onclick="window.submitAdminForceCatering && window.submitAdminForceCatering()" class="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl text-xs font-bold text-white transition active:scale-95 shadow">Start</button>
        </div>
    </div>
</div>

<!-- ADMIN DATE PENALTY MODAL -->
<div id="admin-penalty-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-[99999] flex items-center justify-center p-4">
    <div class="bg-cardBg border border-red-500/50 p-5 rounded-3xl w-full max-w-xs shadow-2xl flex flex-col gap-3 text-gray-900 dark:text-white">
        <div class="flex items-center gap-2 border-b border-gray-200 dark:border-gray-800 pb-2">
            <i class="fa-solid fa-gavel text-red-600 dark:text-red-400"></i>
            <h3 class="font-bold text-xs text-gray-900 dark:text-white">Add Date Penalty</h3>
        </div>
        <div>
            <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Rider</label>
            <select id="penalty-rider-select" class="w-full bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 font-bold">
                <option value="">-- Select Rider --</option>
            </select>
        </div>
        <div>
            <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Target Date</label>
            <input type="date" id="penalty-date-input" class="w-full bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 font-bold">
        </div>
        <div>
            <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Penalty Rate (%)</label>
            <input type="number" id="penalty-rate-input" value="10" placeholder="10" class="w-full bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 font-bold">
        </div>
        <div>
            <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Reason</label>
            <input type="text" id="penalty-reason-input" autocomplete="off" placeholder="e.g. Late shift arrival" class="w-full bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 font-bold">
        </div>
        <div class="flex gap-2 mt-2">
            <button onclick="window.closeAdminPenaltyModal && window.closeAdminPenaltyModal()" class="flex-1 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 py-2.5 rounded-xl text-xs font-bold text-gray-700 dark:text-gray-300">Cancel</button>
            <button onclick="window.submitAdminPenalty && window.submitAdminPenalty()" class="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl text-xs font-bold text-white">Add Penalty</button>
        </div>
    </div>
</div>

<!-- ADMIN MANUAL COMMISSION RECORD MODAL -->
<div id="admin-add-comm-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-[99999] flex items-center justify-center p-4">
    <div class="bg-cardBg border border-emerald-500/50 p-5 rounded-3xl w-full max-w-xs shadow-2xl flex flex-col gap-3 text-gray-900 dark:text-white">
        <div class="flex items-center gap-2 border-b border-gray-200 dark:border-gray-800 pb-2">
            <i class="fa-solid fa-plus-circle text-emerald-600 dark:text-emerald-400"></i>
            <h3 class="font-bold text-xs text-gray-900 dark:text-white">Manual Commission Record</h3>
        </div>
        <div>
            <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Rider</label>
            <select id="manual-comm-rider-select" class="w-full bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 font-bold">
                <option value="">-- Select Rider --</option>
            </select>
        </div>
        <div>
            <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Customer Name</label>
            <input type="text" id="manual-comm-cust-input" autocomplete="off" placeholder="Enter customer name..." class="w-full bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 font-bold">
        </div>
        <div>
            <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Gross Total Fee (₱)</label>
            <input type="number" id="manual-comm-fee-input" placeholder="0.00" class="w-full bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 font-bold">
        </div>
        <div>
            <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Date</label>
            <input type="date" id="manual-comm-date-input" class="w-full bg-inputBg text-xs rounded-xl p-2.5 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 font-bold">
        </div>
        <div class="flex gap-2 mt-2">
            <button onclick="window.closeAdminAddCommModal && window.closeAdminAddCommModal()" class="flex-1 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 py-2.5 rounded-xl text-xs font-bold text-gray-700 dark:text-gray-300">Cancel</button>
            <button onclick="window.submitAdminAddCommissionRecord && window.submitAdminAddCommissionRecord()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-xs font-bold text-white">Save Record</button>
        </div>
    </div>
</div>
