<!-- src/partials/modals/video-preview-modal.html -->
<div id="video-preview-modal" class="hidden fixed inset-0 z-[999999] bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 select-none" style="z-index: 999999 !important;">
    <div class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800 w-full max-w-sm rounded-3xl p-4 shadow-2xl flex flex-col gap-3 animate-in fade-in zoom-in-95 duration-150">
        <!-- HEADER -->
        <div class="flex justify-between items-center border-b border-gray-100 dark:border-gray-800 pb-2.5">
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-rose-500/10 text-rose-600 dark:text-rose-400 flex items-center justify-center text-sm font-bold shrink-0">
                    <i class="fa-solid fa-video"></i>
                </div>
                <div class="min-w-0">
                    <h3 class="font-bold text-xs sm:text-sm text-gray-900 dark:text-white truncate">Send Video</h3>
                    <p id="video-preview-meta" class="text-[10px] text-gray-500 dark:text-gray-400 truncate">Preview before sending</p>
                </div>
            </div>
            <button type="button" onclick="window.closeVideoPreviewModal && window.closeVideoPreviewModal()" class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 hover:text-gray-900 dark:text-gray-200 dark:hover:text-white flex items-center justify-center transition active:scale-95 cursor-pointer">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
        </div>

        <!-- VIDEO PREVIEW CONTAINER -->
        <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-inner flex items-center justify-center border border-gray-200 dark:border-gray-800">
            <video id="video-preview-player" controls playsinline class="w-full h-full object-contain"></video>
            <div id="video-preview-badge" class="absolute top-2 right-2 bg-black/70 backdrop-blur-xs px-2 py-0.5 rounded-full text-[9px] font-bold text-white flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-clock text-rose-400 text-[8px]"></i>
                <span id="video-preview-duration">0:00</span>
            </div>
        </div>

        <!-- CAPTION INPUT -->
        <div class="flex flex-col gap-1">
            <label for="video-preview-caption-input" class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase">Caption (Optional)</label>
            <input type="text" id="video-preview-caption-input" placeholder="Add notes about this video..." class="w-full bg-inputBg text-xs rounded-xl px-3 py-2 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white focus:border-rose-500">
        </div>

        <!-- UPLOAD PROGRESS BAR (HIDDEN INITIALLY) -->
        <div id="video-preview-progress-container" class="hidden flex flex-col gap-1.5 p-2 bg-rose-50 dark:bg-rose-950/30 rounded-xl border border-rose-200 dark:border-rose-800/40">
            <div class="flex justify-between text-[10px] font-bold text-rose-700 dark:text-rose-300">
                <span id="video-preview-progress-label">Uploading video...</span>
                <span id="video-preview-progress-percent">0%</span>
            </div>
            <div class="w-full h-2 bg-rose-200 dark:bg-rose-900/50 rounded-full overflow-hidden">
                <div id="video-preview-progress-bar" class="h-full bg-rose-500 rounded-full transition-all duration-150" style="width: 0%;"></div>
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="flex items-center gap-2 pt-1">
            <button type="button" onclick="window.closeVideoPreviewModal && window.closeVideoPreviewModal()" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-gray-300 rounded-xl text-xs font-bold transition active:scale-95 cursor-pointer">
                Cancel
            </button>
            <button type="button" id="video-preview-send-btn" onclick="window.confirmSendChatVideo && window.confirmSendChatVideo()" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-paper-plane text-xs"></i> Send Video
            </button>
        </div>
    </div>
</div>
