<!-- src/partials/modals/rider-chat.html -->
<div id="rider-chat-modal" class="hidden fixed inset-0 z-[9990] bg-black/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white dark:bg-cardBg border border-gray-200 dark:border-gray-800 w-full max-w-md h-[85vh] max-h-[640px] rounded-3xl shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- HEADER WITH INFO BUTTON -->
        <div class="p-4 bg-gray-50 dark:bg-darkBg/90 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div id="rider-chat-avatar" class="w-10 h-10 rounded-full bg-emerald-600 text-white font-black flex items-center justify-center text-sm shadow-sm">
                    CU
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h3 id="rider-chat-cust-name" class="font-black text-sm text-gray-900 dark:text-white">Customer Name</h3>
                        <button type="button" onclick="window.showCustomerDetails && window.showCustomerDetails()" class="w-6 h-6 rounded-full bg-blue-50 text-blue-700 border border-blue-200 dark:bg-blue-500/20 dark:text-blue-400 dark:border-transparent hover:bg-blue-500 hover:text-white transition flex items-center justify-center text-xs shadow-xs" title="View Customer Info">
                            <i class="fa-solid fa-circle-info"></i>
                        </button>
                    </div>
                    <p class="text-[10px] text-emerald-600 dark:text-emerald-400 font-mono flex items-center gap-1 font-bold">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        Real-time Connected
                    </p>
                </div>
            </div>
            <button onclick="window.closeRiderChatModal && window.closeRiderChatModal()" class="text-gray-400 hover:text-gray-700 dark:hover:text-white p-2 text-base transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- LOCK BANNER -->
        <div id="rider-chat-lock-banner" class="hidden bg-amber-50 dark:bg-amber-500/20 border-b border-amber-200 dark:border-amber-500/40 px-3 py-1.5 text-[11px] text-amber-800 dark:text-amber-300 font-bold text-center shrink-0"></div>

        <!-- ORDER CHECKPOINT MILESTONE TRACKER -->
        <div id="rider-chat-milestone-bar" class="hidden bg-gray-50 dark:bg-black/40 border-b border-gray-200 dark:border-gray-800 p-2 shrink-0">
            <div class="flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
                <button type="button" onclick="window.setOrderMilestone && window.setOrderMilestone('preparing')" id="milestone-btn-preparing" class="flex-1 min-w-[70px] py-1 px-1.5 rounded-lg border border-gray-300 dark:border-gray-700 text-gray-500 dark:text-gray-400 font-bold text-[9px] transition active:scale-95 text-center flex flex-col items-center gap-0.5">
                    <i class="fa-solid fa-fire text-[10px]"></i>
                    <span>Preparing</span>
                </button>
                <button type="button" onclick="window.setOrderMilestone && window.setOrderMilestone('picked_up')" id="milestone-btn-picked_up" class="flex-1 min-w-[75px] py-1 px-1.5 rounded-lg border border-gray-300 dark:border-gray-700 text-gray-500 dark:text-gray-400 font-bold text-[9px] transition active:scale-95 text-center flex flex-col items-center gap-0.5">
                    <i class="fa-solid fa-box text-[10px]"></i>
                    <span>Picked Up</span>
                </button>
                <button type="button" onclick="window.setOrderMilestone && window.setOrderMilestone('arrived')" id="milestone-btn-arrived" class="flex-1 min-w-[70px] py-1 px-1.5 rounded-lg border border-gray-300 dark:border-gray-700 text-gray-500 dark:text-gray-400 font-bold text-[9px] transition active:scale-95 text-center flex flex-col items-center gap-0.5">
                    <i class="fa-solid fa-location-dot text-[10px]"></i>
                    <span>Arrived</span>
                </button>
                <button type="button" onclick="window.openPodModal && window.openPodModal()" id="milestone-btn-delivered" class="flex-1 min-w-[75px] py-1 px-1.5 rounded-lg border border-gray-300 dark:border-gray-700 text-gray-500 dark:text-gray-400 font-bold text-[9px] transition active:scale-95 text-center flex flex-col items-center gap-0.5">
                    <i class="fa-solid fa-camera text-[10px]"></i>
                    <span>POD / Done</span>
                </button>
            </div>
        </div>

        <!-- ACTION BUTTONS ROW WITH STORE CHATS LAUNCHER -->
        <div id="rider-chat-action-toolbar" class="p-2.5 bg-gray-100 dark:bg-darkBg/60 border-b border-gray-200 dark:border-gray-800/80 flex items-center gap-2 overflow-x-auto shrink-0 no-scrollbar">
            <!-- STORE HUBS CONTACT BUTTON -->
            <button id="rider-chat-store-hub-btn" onclick="window.openRiderStoreChatPicker && window.openRiderStoreChatPicker()" class="min-w-[85px] bg-orange-600 hover:bg-orange-500 text-white border border-orange-500/40 py-2 px-3 rounded-xl text-xs font-bold transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-store"></i> Store Hub
            </button>

            <button onclick="window.markThreadUndone && window.markThreadUndone()" class="flex-1 min-w-[80px] bg-indigo-600 hover:bg-indigo-500 text-white border border-indigo-500/30 py-2 px-3 rounded-xl text-xs font-bold transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-rotate-left"></i> Undone
            </button>
            <button onclick="window.followUpCustomerOrder && window.followUpCustomerOrder()" class="flex-1 min-w-[90px] bg-amber-600 hover:bg-amber-500 text-white border border-amber-500/30 py-2 px-3 rounded-xl text-xs font-bold transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-bookmark"></i> Follow Up
            </button>
            <button onclick="window.completeCatering && window.completeCatering()" class="flex-1 min-w-[75px] bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-500/30 py-2 px-3 rounded-xl text-xs font-bold transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-circle-check"></i> Done
            </button>
            <button id="rider-chat-cancel-btn" onclick="window.cancelCatering && window.cancelCatering()" class="hidden flex-1 min-w-[80px] bg-red-600 hover:bg-red-500 text-white border border-red-500/30 py-2 px-3 rounded-xl text-xs font-bold transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-ban"></i> Cancel
            </button>
        </div>

        <!-- SAVED QUICK REPLIES BAR -->
        <div id="quick-replies-drawer" class="hidden bg-gray-50 dark:bg-darkBg/95 border-b border-gray-200 dark:border-gray-800 p-2.5 flex items-center gap-2 overflow-x-auto shrink-0 no-scrollbar">
            <span class="text-[10px] text-amber-600 dark:text-amber-400 font-bold uppercase shrink-0"><i class="fa-solid fa-bolt"></i> Saved:</span>
            <button onclick="window.sendQuickReply && window.sendQuickReply('Papunta na po ako sa location niyo 🛵')" class="bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap transition active:scale-95">
                🛵 Papunta na po ako
            </button>
            <button onclick="window.sendQuickReply && window.sendQuickReply('Nandito na po ako sa labas/location 📍')" class="bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap transition active:scale-95">
                📍 Nandito na po sa labas
            </button>
            <button onclick="window.sendQuickReply && window.sendQuickReply('Nabili/Nakuha na po ang order ninyo 🛒')" class="bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap transition active:scale-95">
                🛒 Nabili na po order
            </button>
            <button onclick="window.sendQuickReply && window.sendQuickReply('Paki-handa po ang eksaktong pambayad 💵')" class="bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap transition active:scale-95">
                💵 Paki-handa ang pambayad
            </button>
        </div>

        <!-- CHAT MESSAGES BODY -->
        <div id="rider-chat-messages-container" class="flex-1 min-h-0 p-4 overflow-y-auto overscroll-contain flex flex-col gap-3 scroll-smooth bg-gray-50 dark:bg-black/30">
            <div class="text-center text-gray-400 dark:text-gray-500 italic text-xs py-8">Loading real-time chat history...</div>
        </div>

        <!-- FOOTER INPUT BAR -->
        <div class="p-3 bg-white dark:bg-darkBg/90 border-t border-gray-200 dark:border-gray-800 flex items-center gap-2 shrink-0">
            <button type="button" id="chat-hd-toggle-btn" onclick="window.toggleHdMode && window.toggleHdMode()" class="p-2 bg-inputBg text-gray-500 dark:text-gray-400 rounded-xl border border-gray-300 dark:border-gray-700 hover:text-gray-900 dark:hover:text-white transition active:scale-95 text-xs font-bold" title="Toggle HD Mode">
                <i id="chat-hd-icon" class="fa-solid fa-compress"></i>
            </button>
            <button onclick="window.toggleQuickReplies && window.toggleQuickReplies()" class="p-2.5 bg-inputBg hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 rounded-xl border border-gray-300 dark:border-gray-700 transition active:scale-95 text-xs" title="Saved Quick Replies">
                <i class="fa-solid fa-bolt"></i>
            </button>
            <button onclick="window.promptImageAttachmentSource && window.promptImageAttachmentSource()" class="p-2.5 bg-inputBg hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 rounded-xl border border-gray-300 dark:border-gray-700 transition active:scale-95 text-xs" title="Send Image">
                <i class="fa-solid fa-image"></i>
            </button>
            <button onclick="window.sendChatLocationPin && window.sendChatLocationPin()" class="p-2.5 bg-inputBg hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 rounded-xl border border-gray-300 dark:border-gray-700 transition active:scale-95 text-xs" title="Pick Rider Location Pin on Map">
                <i class="fa-solid fa-location-dot"></i>
            </button>

            <input type="text" id="rider-chat-input" placeholder="Type reply..." onkeydown="if(event.key === 'Enter') window.sendRiderChatMessage && window.sendRiderChatMessage()" class="flex-1 bg-inputBg text-xs rounded-xl p-3 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white focus:border-blue-500">

            <button id="rider-cust-send-btn" onclick="window.sendRiderChatMessage && window.sendRiderChatMessage()" class="p-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg transition active:scale-95 text-xs shrink-0">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

        <input type="file" id="chat-camera-input" accept="image/*" capture="environment" class="hidden" onchange="window.handleChatImageUpload && window.handleChatImageUpload(this)">
        <input type="file" id="chat-file-input" accept="image/*" multiple class="hidden" onchange="window.handleChatImageUpload && window.handleChatImageUpload(this)">

    </div>
</div>

<!-- PROOF OF DELIVERY (POD) CONFIRMATION MODAL -->
<div id="pod-capture-modal" class="hidden fixed inset-0 z-[99999] bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white dark:bg-cardBg border border-emerald-500/40 w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-150">
        <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-800 pb-3">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm font-bold">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-gray-900 dark:text-white">Proof of Delivery (POD)</h3>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400">Capture drop-off confirmation photo</p>
                </div>
            </div>
            <button onclick="window.closePodModal && window.closePodModal()" class="text-gray-400 hover:text-gray-700 dark:hover:text-white p-1 text-sm transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- POD Image Preview Container -->
        <div id="pod-preview-container" class="relative w-full h-44 bg-gray-100 dark:bg-black/40 rounded-2xl border-2 border-dashed border-gray-300 dark:border-gray-700 flex flex-col items-center justify-center overflow-hidden">
            <img id="pod-preview-img" src="" class="hidden w-full h-full object-cover rounded-2xl">
            <div id="pod-placeholder-ui" class="flex flex-col items-center gap-2 text-center p-3">
                <i class="fa-solid fa-box-open text-3xl text-gray-400"></i>
                <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">Take photo of parcel or item at drop-off</span>
            </div>
        </div>

        <!-- POD Action Buttons -->
        <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="document.getElementById('pod-camera-input').click()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 dark:bg-blue-600/30 dark:hover:bg-blue-600 dark:text-blue-300 py-2.5 px-3 rounded-xl text-xs font-bold transition active:scale-95 flex items-center justify-center gap-1.5 shadow-xs">
                <i class="fa-solid fa-camera"></i> Camera
            </button>
            <button type="button" onclick="document.getElementById('pod-file-input').click()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-gray-300 py-2.5 px-3 rounded-xl text-xs font-bold transition active:scale-95 flex items-center justify-center gap-1.5 shadow-xs">
                <i class="fa-solid fa-folder-open"></i> Gallery
            </button>
        </div>

        <input type="file" id="pod-camera-input" accept="image/*" capture="environment" class="hidden" onchange="window.handlePodImageSelected && window.handlePodImageSelected(this)">
        <input type="file" id="pod-file-input" accept="image/*" class="hidden" onchange="window.handlePodImageSelected && window.handlePodImageSelected(this)">

        <div class="flex gap-2 pt-1 border-t border-gray-200 dark:border-gray-800">
            <button type="button" onclick="window.submitProofOfDelivery && window.submitProofOfDelivery(false)" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-gray-300 py-3 rounded-xl text-xs font-bold transition active:scale-95">
                Complete Without Photo
            </button>
            <button type="button" id="pod-confirm-btn" onclick="window.submitProofOfDelivery && window.submitProofOfDelivery(true)" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-xs font-black shadow-lg transition active:scale-95 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-check-double"></i> Complete & Done
            </button>
        </div>
    </div>
</div>
