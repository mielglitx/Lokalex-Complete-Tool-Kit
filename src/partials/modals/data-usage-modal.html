<!-- src/partials/modals/data-usage-modal.html -->
<div id="data-usage-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
    <div class="w-full max-w-md bg-white dark:bg-[#0c1418] border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden animate-in fade-in zoom-in-95 duration-200">
        
        <!-- Header -->
        <div class="p-4 sm:p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-[#11191e] shrink-0">
            <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-chart-simple"></i>
                </span>
                <div>
                    <h3 class="font-black text-sm text-slate-900 dark:text-white flex items-center gap-2">
                        Data Usage Monitor
                        <span class="inline-flex items-center gap-1 text-[9px] font-mono font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Live
                        </span>
                    </h3>
                    <p class="text-[10px] text-slate-500 font-medium">Tracks cellular data consumed by each feature</p>
                </div>
            </div>
            <button type="button" onclick="window.closeDataUsageModal && window.closeDataUsageModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white flex items-center justify-center transition active:scale-95 cursor-pointer">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- Time Windows Pill Filter Bar -->
        <div class="p-3 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#0e161b] flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0">
            <button id="data-usage-tab-10m" type="button" onclick="window.switchDataUsageWindow('10m')" class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0">10 Mins</button>
            <button id="data-usage-tab-30m" type="button" onclick="window.switchDataUsageWindow('30m')" class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0">30 Mins</button>
            <button id="data-usage-tab-1h"  type="button" onclick="window.switchDataUsageWindow('1h')"  class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0">1 Hour</button>
            <button id="data-usage-tab-5h"  type="button" onclick="window.switchDataUsageWindow('5h')"  class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0">5 Hours</button>
            <button id="data-usage-tab-1d"  type="button" onclick="window.switchDataUsageWindow('1d')"  class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0">1 Day</button>
            <button id="data-usage-tab-1w"  type="button" onclick="window.switchDataUsageWindow('1w')"  class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0">1 Week</button>
            <button id="data-usage-tab-1mo" type="button" onclick="window.switchDataUsageWindow('1mo')" class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0">1 Month</button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-5 flex flex-col gap-4">
            
            <!-- Hero Stat Card -->
            <div class="p-4 rounded-2xl bg-gradient-to-br from-emerald-500/10 via-emerald-500/5 to-transparent border border-emerald-500/20 flex flex-col gap-1.5">
                <span class="text-[11px] font-bold text-slate-500 dark:text-slate-400" id="data-usage-window-label">Data consumed in the last 1 Day</span>
                <div class="flex items-baseline gap-2">
                    <span id="data-usage-total-display" class="text-3xl font-black font-mono text-emerald-600 dark:text-emerald-400">0 KB</span>
                    <span class="text-[10px] text-slate-400 font-mono">mobile data</span>
                </div>
                <div id="data-usage-top-category" class="text-xs text-slate-700 dark:text-slate-300 font-medium pt-1 border-t border-emerald-500/15">
                    Analyzing network transfer...
                </div>
            </div>

            <!-- Category Breakdown Section -->
            <div class="flex flex-col gap-2.5">
                <div class="flex items-center justify-between text-xs font-bold text-slate-500 dark:text-slate-400 px-1">
                    <span>Usage Breakdown by Part of App</span>
                    <span>Total Consumed</span>
                </div>
                <div id="data-usage-breakdown-list" class="flex flex-col gap-2">
                    <!-- Dynamic categories injected here -->
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="p-3.5 sm:p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-[#11191e] flex items-center justify-between gap-2 shrink-0">
            <button type="button" onclick="window.clearDataUsageHistory && window.clearDataUsageHistory()" class="px-3 py-2 rounded-xl text-xs font-bold text-rose-600 dark:text-rose-400 hover:bg-rose-500/10 transition active:scale-95 cursor-pointer flex items-center gap-1.5" title="Reset usage statistics counter">
                <i class="fa-solid fa-trash-can text-[11px]"></i> Clear Stats
            </button>
            <button type="button" onclick="window.closeDataUsageModal && window.closeDataUsageModal()" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-black text-xs transition active:scale-95 cursor-pointer shadow-sm">
                Done
            </button>
        </div>

    </div>
</div>
