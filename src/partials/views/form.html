<section id="view-form" class="hidden flex-1 flex flex-col gap-4 p-4 overflow-y-auto">
    <div id="edit-warning" class="hidden bg-amber-500/10 border border-amber-500 p-3 rounded-xl flex items-center gap-3 text-amber-400 text-xs">
        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
        <div id="warning-text">Editing record.</div>
    </div>
    <div class="flex flex-col gap-3">
        <label class="text-xs text-gray-400 font-bold">Name / Store Name</label>
        <input type="text" id="form-name" name="form_name_no_fill" readonly onfocus="this.removeAttribute('readonly');" autocomplete="one-time-code" data-lpignore="true" class="bg-inputBg text-sm rounded-xl p-3 outline-none border border-gray-700">
        <label class="text-xs text-gray-400 font-bold">Contact Number</label>
        <input type="text" id="form-contact" name="form_contact_no_fill" readonly onfocus="this.removeAttribute('readonly');" autocomplete="one-time-code" data-lpignore="true" class="bg-inputBg text-sm rounded-xl p-3 outline-none border border-gray-700">
        <label class="text-xs text-gray-400 font-bold">General Address</label>
        <input type="text" id="form-address" name="form_address_no_fill" readonly onfocus="this.removeAttribute('readonly');" autocomplete="one-time-code" data-lpignore="true" class="bg-inputBg text-sm rounded-xl p-3 outline-none border border-gray-700">
        <label class="text-xs text-gray-400 font-bold">Map Link (Lat_Lon_Link)</label>
        <div class="flex gap-2">
            <input type="text" id="form-latlon" name="form_latlon_no_fill" readonly onfocus="this.removeAttribute('readonly');" autocomplete="one-time-code" data-lpignore="true" placeholder="Paste link or get from Map" class="flex-1 bg-inputBg text-sm rounded-xl p-3 outline-none border border-gray-700">
            <button onclick="window.openMapPicker && window.openMapPicker()" class="bg-blue-600 hover:bg-blue-500 px-4 rounded-xl text-white text-sm font-bold flex items-center gap-2 transition active:scale-95">
                <i class="fa-solid fa-map-location-dot"></i> Map
            </button>
        </div>
    </div>
    <button onclick="window.submitForm && window.submitForm()" id="form-submit-btn" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold p-4 rounded-xl shadow-lg mt-auto transition active:scale-95">
        SAVE RECORD
    </button>
</section>
