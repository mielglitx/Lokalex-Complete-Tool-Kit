<!-- src/partials/views/cart.html -->
<section id="view-cart" class="hidden flex-1 flex flex-col text-gray-900 dark:text-white pb-24 relative">
    <!-- STICKY TOP TOOLBAR -->
    <div class="sticky top-0 z-20 shrink-0 bg-white dark:bg-cardBg shadow-xs flex flex-col">
        <div class="bg-white dark:bg-cardBg border-b border-gray-200 dark:border-gray-800 p-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0" id="cart-tabs-header"></div>

        <div class="bg-gray-50 dark:bg-inputBg/80 px-3 py-2 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between gap-2 shrink-0">
            <span class="text-xs font-bold text-amber-700 dark:text-amber-400 shrink-0 flex items-center gap-1.5">
                <i class="fa-solid fa-user-check"></i> Assign Client:
            </span>
            <div id="cart-customer-selector-container" class="flex-1 flex items-center"></div>
        </div>

        <div class="bg-gray-100 dark:bg-black/40 p-3 px-4 flex justify-between items-center text-sm border-b border-gray-200 dark:border-gray-800 shrink-0">
            <span class="text-gray-600 dark:text-gray-400 font-bold"><span id="cart-slot-label" class="font-black text-gray-900 dark:text-white">Cart 1</span> Subtotal:</span>
            <span class="text-lg font-black text-emerald-600 dark:text-green-400 font-mono">₱<span id="cart-subtotal-display">0.00</span></span>
        </div>
        
        <div class="p-3 flex justify-between gap-2 shrink-0 flex-wrap" id="cart-actions-toolbar">
            <button onclick="window.showBulkAddModal && window.showBulkAddModal()" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 dark:bg-blue-600/20 dark:text-blue-400 dark:border-blue-600/30 text-xs font-bold py-2 rounded-xl transition active:scale-95 shadow-xs flex items-center justify-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-list-check"></i> Paste List
            </button>
            <div id="delete-selected-btn-container" class="contents"></div>
            <button id="cart-action-btn" onclick="window.handleCartActionBtn && window.handleCartActionBtn()" class="flex-1 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 dark:bg-red-600/20 dark:text-red-400 dark:border-red-600/30 text-xs font-bold py-2 rounded-xl transition active:scale-95 shadow-xs flex items-center justify-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-trash-can"></i> Clear Cart 1
            </button>
        </div>
    </div>

    <!-- SCROLLABLE CART ITEMS WITH RELATIVE SCROLLER TRACK -->
    <div class="relative flex-1 min-h-0 flex flex-col">
        <div id="cart-items-list" class="flex-1 p-3 flex flex-col gap-2 pb-28 max-h-[calc(100vh-270px)] sm:max-h-[calc(100vh-280px)] overflow-y-auto" style="touch-action: pan-y; -webkit-overflow-scrolling: touch; will-change: scroll-position;"></div>
        
        <!-- Smart Cart Slider Scroller (Permanently visible rail & circular knob when screen is full or 5+ items) -->
        <div id="cart-slider-track" class="absolute right-1 top-2 bottom-6 w-8 flex justify-center z-30 select-none cursor-pointer transition-opacity duration-200 opacity-0 pointer-events-none">
            <!-- Visible sleek rail track -->
            <div class="w-1.5 h-full bg-gray-300/80 dark:bg-zinc-700/80 rounded-full my-0.5"></div>
            <!-- Circular thumb knob -->
            <div id="cart-slider-thumb" class="pointer-events-auto absolute top-0 w-8 h-8 rounded-full bg-blue-600 hover:bg-blue-500 text-white shadow-xl backdrop-blur-md flex items-center justify-center cursor-grab active:cursor-grabbing active:scale-125 hover:scale-105 transition-transform duration-75 border-2 border-white dark:border-cyan-300 shadow-blue-500/50">
                <i class="fa-solid fa-arrows-up-down text-[11px] text-white"></i>
            </div>
        </div>
    </div>

    <!-- ALWAYS VISIBLE FIXED BOTTOM GENERATE RECEIPT BUTTON -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 sm:p-4 bg-white/95 dark:bg-cardBg/95 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 z-40 shadow-2xl">
        <button id="cart-generate-receipt-btn" onclick="window.validateAndProceedToWizard && window.validateAndProceedToWizard()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black p-3.5 rounded-2xl shadow-lg transition active:scale-95 text-xs flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-receipt"></i> Generate Receipt (<span id="btn-cart-slot-label">Cart 1</span>)
        </button>
    </div>

    <!-- 1. DEDICATED ADD / EDIT PRICE MODAL -->
    <div id="cart-add-price-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-200 dark:border-gray-800 w-full max-w-xs rounded-2xl p-4 shadow-2xl flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-800 pb-2">
                <h3 class="text-xs font-black text-gray-900 dark:text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-tag text-emerald-500"></i> Set Item Price
                </h3>
                <button type="button" onclick="window.closeAddPriceModal && window.closeAddPriceModal()" class="w-6 h-6 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 hover:text-gray-900 dark:text-gray-200 dark:hover:text-white flex items-center justify-center transition active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-xmark text-[11px]"></i>
                </button>
            </div>
            
            <div class="text-[11px] font-bold text-gray-600 dark:text-gray-400 truncate" id="price-modal-item-name">Item Name</div>

            <div class="relative flex items-center">
                <span class="absolute left-3 text-xs font-bold text-gray-400 font-mono select-none">₱</span>
                <input type="number" step="any" id="cart-item-price-input" placeholder="0.00" class="w-full bg-inputBg text-sm font-black font-mono pl-7 pr-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 outline-none text-emerald-600 dark:text-green-400 focus:border-emerald-500">
            </div>

            <div class="flex gap-2 pt-1">
                <button type="button" onclick="window.closeAddPriceModal && window.closeAddPriceModal()" class="flex-1 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-xs font-bold text-gray-700 dark:text-gray-300 transition active:scale-95">Cancel</button>
                <button type="button" onclick="window.saveItemPrice && window.saveItemPrice()" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow-md transition active:scale-95 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-check"></i> Save Price
                </button>
            </div>
        </div>
    </div>

    <!-- 2. DEDICATED EDIT ITEM NAME MODAL -->
    <div id="cart-edit-name-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-200 dark:border-gray-800 w-full max-w-xs rounded-2xl p-4 shadow-2xl flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-800 pb-2">
                <h3 class="text-xs font-black text-gray-900 dark:text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-pen text-blue-500"></i> Edit Item Name
                </h3>
                <button type="button" onclick="window.closeEditNameModal && window.closeEditNameModal()" class="w-6 h-6 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 hover:text-gray-900 dark:text-gray-200 dark:hover:text-white flex items-center justify-center transition active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-xmark text-[11px]"></i>
                </button>
            </div>

            <div>
                <label class="text-[10px] text-gray-500 font-bold uppercase">Item Description / Name</label>
                <input type="text" id="cart-edit-name-input" placeholder="Enter item name" class="w-full bg-inputBg text-xs font-bold p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1 focus:border-blue-500">
            </div>

            <div class="flex gap-2 pt-1">
                <button type="button" onclick="window.closeEditNameModal && window.closeEditNameModal()" class="flex-1 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-xs font-bold text-gray-700 dark:text-gray-300 transition active:scale-95">Cancel</button>
                <button type="button" onclick="window.saveItemName && window.saveItemName()" class="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-bold text-white shadow-md transition active:scale-95 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-floppy-disk"></i> Save Name
                </button>
            </div>
        </div>
    </div>
</section>
