<section id="view-receipt-final" class="hidden flex-1 flex flex-col p-4 gap-4 overflow-y-auto">
    <div class="flex-1 bg-cardBg border border-gray-800 rounded-xl p-4 overflow-y-auto min-h-[180px]">
        <pre id="final-receipt-text" class="text-xs font-mono text-gray-300 whitespace-pre-wrap"></pre>
    </div>
    
    <div class="flex gap-2">
        <button onclick="window.copyFinalReceipt && window.copyFinalReceipt()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg flex justify-center items-center gap-2 transition active:scale-95">
            <i class="fa-solid fa-copy"></i> Copy
        </button>
        <button onclick="window.completeReceiptDone && window.completeReceiptDone()" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3.5 rounded-xl shadow-lg flex justify-center items-center gap-2 transition active:scale-95">
            <i class="fa-solid fa-check"></i> Done
        </button>
    </div>
</section>
