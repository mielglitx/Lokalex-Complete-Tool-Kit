<!-- src/partials/views/commission.html -->
<section id="view-commission" class="hidden flex-1 flex flex-col p-4 gap-4 overflow-y-auto">
    <div class="bg-white dark:bg-cardBg p-3.5 rounded-2xl border border-gray-200 dark:border-gray-800 flex flex-col gap-3 shadow-xs">
        <div id="admin-commission-filter-box" class="hidden flex-col gap-1 border-b border-gray-200 dark:border-gray-800 pb-3">
            <span class="text-[10px] text-amber-700 dark:text-amber-400 font-bold uppercase tracking-wider flex items-center gap-1.5"><i class="fa-solid fa-user-shield"></i> Admin View: Select Rider</span>
            <select id="admin-rider-select" onchange="window.refreshCommissionView && window.refreshCommissionView()" class="w-full bg-gray-50 dark:bg-inputBg text-sm font-bold text-gray-900 dark:text-white rounded-xl p-2.5 outline-none border border-gray-300 dark:border-gray-700 focus:border-amber-500 transition"></select>
        </div>

        <div class="flex bg-gray-100 dark:bg-darkBg rounded-xl p-1 text-xs font-bold border border-gray-200 dark:border-gray-800">
            <button id="comm-mode-earned" onclick="window.setCommissionMode && window.setCommissionMode('earned')" class="flex-1 py-2 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-300 dark:bg-emerald-600/20 dark:text-emerald-400 dark:border-emerald-500/50 font-black transition shadow-xs">My Earnings</button>
            <button id="comm-mode-company" onclick="window.setCommissionMode && window.setCommissionMode('company')" class="flex-1 py-2 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-bold transition">To Pay (Company)</button>
        </div>

        <div class="grid grid-cols-3 gap-1 bg-gray-100 dark:bg-darkBg rounded-xl p-1 text-[10px] font-bold border border-gray-200 dark:border-gray-800">
            <button id="comm-period-daily" onclick="window.setCommissionPeriod && window.setCommissionPeriod('daily')" class="py-1.5 rounded-lg bg-blue-600 text-white font-bold transition shadow">Daily</button>
            <button id="comm-period-weekly" onclick="window.setCommissionPeriod && window.setCommissionPeriod('weekly')" class="py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-bold transition">Weekly</button>
            <button id="comm-period-monthly" onclick="window.setCommissionPeriod && window.setCommissionPeriod('monthly')" class="py-1.5 rounded-lg text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white font-bold transition">Monthly</button>
        </div>

        <div class="flex justify-between items-center">
            <span class="text-xs text-gray-600 dark:text-gray-400 font-bold" id="comm-date-label">Select Date:</span>
            <input type="date" id="comm-input-daily" onchange="window.refreshCommissionView && window.refreshCommissionView()" class="bg-gray-50 dark:bg-inputBg text-xs rounded-xl p-2 outline-none border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white font-bold font-mono">
            <input type="week" id="comm-input-weekly" onchange="window.refreshCommissionView && window.refreshCommissionView()" class="hidden bg-gray-50 dark:bg-inputBg text-xs rounded-xl p-2 outline-none border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white font-bold font-mono">
            <input type="month" id="comm-input-monthly" onchange="window.refreshCommissionView && window.refreshCommissionView()" class="hidden bg-gray-50 dark:bg-inputBg text-xs rounded-xl p-2 outline-none border border-gray-300 dark:border-gray-700 text-gray-900 dark:text-white font-bold font-mono">
        </div>
    </div>

    <div class="bg-white dark:bg-cardBg p-4 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-xs flex flex-col gap-3 relative overflow-hidden text-gray-900 dark:text-white">
        <div class="text-xs text-gray-600 dark:text-gray-400 uppercase tracking-widest font-black text-center mt-2" id="comm-summary-title">Daily Summary</div>
        
        <div class="flex flex-col items-center justify-center py-2">
            <div class="text-[10px] text-gray-600 dark:text-gray-400 font-bold uppercase" id="comm-main-label">Total Earnings</div>
            <div id="comm-main-wrapper" class="text-4xl font-black text-emerald-600 dark:text-emerald-400 drop-shadow-md">
                <span id="comm-main-currency">₱</span><span id="comm-main-amount">0.00</span>
            </div>
            <div class="text-[10px] text-gray-500 dark:text-gray-400 font-mono font-bold mt-1">Gross Total: ₱<span id="comm-gross-amount">0.00</span></div>
        </div>
    </div>

    <button onclick="window.generateDailyReportText && window.generateDailyReportText()" class="w-full bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white border border-blue-200 dark:bg-blue-600/20 dark:border-blue-600/50 dark:hover:bg-blue-600 dark:text-blue-400 dark:hover:text-white font-bold py-3.5 rounded-2xl shadow-xs flex items-center justify-center gap-2 transition active:scale-95 text-xs">
        <i class="fa-solid fa-file-lines"></i> Generate Text Report
    </button>

    <div class="text-[10px] text-gray-600 dark:text-gray-400 uppercase tracking-wider font-bold mt-2 border-b border-gray-200 dark:border-gray-800 pb-1">Rider Summary</div>
    <div id="commission-rider-list" class="flex flex-col gap-3 pb-20"></div>
</section>
