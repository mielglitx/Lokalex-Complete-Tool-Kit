<!-- src/partials/views/directory.html -->
<section id="view-directory" class="hidden flex-1 flex flex-col relative p-4">
    <!-- INLINE PRIMARY SEARCH CONTAINER (SCROLLS NATURALLY WITH CONTENT, NO HEIGHT COLLAPSE) -->
    <div id="dir-search-container" class="flex gap-2 mb-3 pr-6 transition-all duration-200">
        <div class="relative flex-1">
            <i class="fa-solid fa-search absolute left-3 top-3.5 text-gray-400 text-sm"></i>
            <input type="text" id="search-input" name="search_input_no_fill" readonly onfocus="this.removeAttribute('readonly');" autocomplete="one-time-code" data-lpignore="true" oninput="window.filterDirectoryRecords && window.filterDirectoryRecords()" placeholder="Search records..." class="w-full bg-inputBg text-sm rounded-xl pl-9 pr-9 py-3 outline-none border border-transparent focus:border-blue-500 transition shadow-xs">
            <button type="button" id="clear-search-btn" onclick="window.clearDirectorySearch && window.clearDirectorySearch()" class="hidden absolute right-3 top-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-sm transition p-0.5 cursor-pointer" title="Clear Search">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>
        <button onclick="window.syncData && window.syncData()" class="bg-cardBg hover:bg-inputBg px-4 rounded-xl border border-gray-200 dark:border-gray-800 text-gray-700 dark:text-gray-300 transition active:scale-90 cursor-pointer shadow-xs" title="Refresh">
            <i class="fa-solid fa-rotate"></i>
        </button>
    </div>

    <!-- MINIMIZED UPPER-RIGHT FLOATING SEARCH BADGE (PINNED FIXED WHEN SCROLLED DOWN) -->
    <div id="dir-min-search-wrapper" class="hidden fixed top-[54px] right-4 z-40 flex items-center gap-1.5 transition-all duration-200">
        <button type="button" id="dir-min-search-btn" onclick="window.expandDirectorySearch && window.expandDirectorySearch()" class="bg-blue-600 hover:bg-blue-500 text-white shadow-xl px-3 py-1.5 rounded-full flex items-center gap-1.5 text-xs font-bold transition active:scale-90 cursor-pointer border border-blue-400/40" title="Open Search Bar">
            <i class="fa-solid fa-search text-[11px]"></i>
            <span id="dir-min-search-label" class="text-[10px] truncate max-w-[90px]">Search</span>
            <span id="dir-min-search-indicator" class="hidden w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        </button>
        <button type="button" onclick="window.syncData && window.syncData()" class="bg-cardBg hover:bg-inputBg p-1.5 w-7 h-7 rounded-full border border-gray-200 dark:border-gray-800 text-gray-700 dark:text-gray-300 transition active:scale-90 flex items-center justify-center text-xs shadow-lg cursor-pointer" title="Refresh">
            <i class="fa-solid fa-rotate text-[10px]"></i>
        </button>
    </div>

    <!-- FLOATING EXPANDED SEARCH BAR OVERLAY (REVEALED WHEN TAPPING MINIMIZED BADGE WHILE SCROLLED) -->
    <div id="dir-floating-search-bar" class="hidden fixed top-[48px] sm:top-[52px] left-0 right-0 z-40 bg-cardBg/95 dark:bg-darkBg/95 backdrop-blur-md px-4 py-2 border-b border-gray-200 dark:border-gray-800 shadow-xl transition-all duration-200">
        <div class="max-w-md mx-auto flex gap-2 pr-6">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
                <input type="text" id="floating-search-input" oninput="window.syncAndFilterFloatingSearch && window.syncAndFilterFloatingSearch(this.value)" placeholder="Search records..." class="w-full bg-inputBg text-sm rounded-xl pl-9 pr-9 py-2 outline-none border border-transparent focus:border-blue-500 transition shadow-xs text-gray-900 dark:text-white">
                <button type="button" id="floating-clear-search-btn" onclick="window.clearDirectorySearch && window.clearDirectorySearch()" class="hidden absolute right-3 top-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-sm transition p-0.5 cursor-pointer" title="Clear Search">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            <button type="button" onclick="window.minimizeDirectorySearch && window.minimizeDirectorySearch()" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 px-3 rounded-xl border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 text-xs font-bold transition active:scale-90 flex items-center justify-center cursor-pointer shadow-xs" title="Minimize Search">
                <i class="fa-solid fa-chevron-up text-xs"></i>
            </button>
        </div>
    </div>
    
    <div id="record-list" class="flex-1 flex flex-col gap-3 pb-20 pr-8 overflow-y-auto"></div>
    
    <div id="alphabet-scrubber" class="fixed right-2 top-1/2 -translate-y-1/2 flex flex-col text-[10px] text-gray-400 font-bold z-30 touch-none select-none"></div>

    <button id="directory-add-fab" onclick="window.openForm && window.openForm(null)" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 hover:bg-blue-500 text-white rounded-full shadow-2xl flex items-center justify-center text-xl z-40 transition active:scale-90 cursor-pointer">
        <i class="fa-solid fa-plus"></i>
    </button>
</section>
