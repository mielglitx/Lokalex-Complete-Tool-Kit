<section id="view-directory" class="hidden flex-1 flex flex-col relative p-4">
    <div class="flex gap-2 mb-4 pr-6">
        <div class="relative flex-1">
            <i class="fa-solid fa-search absolute left-3 top-3.5 text-gray-400 text-sm"></i>
            <input type="text" id="search-input" name="search_input_no_fill" readonly onfocus="this.removeAttribute('readonly');" autocomplete="one-time-code" data-lpignore="true" oninput="window.filterDirectoryRecords && window.filterDirectoryRecords()" placeholder="Search records..." class="w-full bg-inputBg text-sm rounded-xl pl-9 pr-4 py-3 outline-none border border-transparent focus:border-blue-500 transition">
        </div>
        <button onclick="window.syncData && window.syncData()" class="bg-cardBg hover:bg-inputBg px-4 rounded-xl border border-gray-800 text-gray-300 transition active:scale-90" title="Refresh">
            <i class="fa-solid fa-rotate"></i>
        </button>
    </div>
    
    <div id="record-list" class="flex-1 flex flex-col gap-3 pb-20 pr-8 overflow-y-auto"></div>
    
    <div id="alphabet-scrubber" class="fixed right-2 top-1/2 -translate-y-1/2 flex flex-col text-[10px] text-gray-400 font-bold z-30 touch-none select-none"></div>

    <button id="directory-add-fab" onclick="window.openForm && window.openForm(null)" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 hover:bg-blue-500 text-white rounded-full shadow-2xl flex items-center justify-center text-xl z-40 transition active:scale-90">
        <i class="fa-solid fa-plus"></i>
    </button>
</section>
