<!-- src/partials/views/login.html -->
<section id="view-login" class="flex-1 flex flex-col justify-center items-center p-4 sm:p-6 gap-4 min-h-full">
    <!-- BRAND LOGO & HEADER -->
    <div class="text-center mb-1">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/10 border border-blue-500/20 text-blue-500 mb-2 shadow-sm">
            <i class="fa-solid fa-bag-shopping text-2xl"></i>
        </div>
        <h2 class="text-2xl font-black text-gray-900 dark:text-white tracking-tight">L<i class="fa-solid fa-location-dot text-red-500"></i>kalex Hub</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Delivery & Operations Portal</p>
    </div>

    <!-- UNIFIED AUTH CONTAINER -->
    <div class="bg-cardBg w-full max-w-sm p-5 sm:p-6 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-2xl flex flex-col gap-4 text-center">
        
        <!-- 1. UNIFIED LOGIN FORM -->
        <div id="unified-login-section" class="flex flex-col gap-3">
            <div>
                <h3 class="text-xs font-black uppercase tracking-wider text-blue-600 dark:text-blue-400 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-right-to-bracket"></i> Account Login
                </h3>
                <p class="text-[11px] text-gray-500 dark:text-gray-400 mt-0.5">I-enter ang Rider ID, Mobile No. (09...), o Store Username</p>
            </div>

            <div class="flex flex-col gap-2.5 text-left mt-1">
                <!-- Identifier Input -->
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Account Identifier</label>
                    <div class="relative">
                        <i class="fa-solid fa-user-shield absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
                        <input type="text" id="unified-login-identifier" autocomplete="username" placeholder="Rider ID / Mobile / Username" onkeydown="if(event.key === 'Enter') document.getElementById('unified-login-password')?.focus()" class="w-full bg-inputBg text-xs rounded-xl pl-9 pr-3 py-3 outline-none border border-gray-300 dark:border-gray-700 focus:border-blue-500 transition font-mono font-bold text-gray-900 dark:text-white">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
                        <input type="password" id="unified-login-password" autocomplete="current-password" placeholder="Enter Password" onkeydown="if(event.key === 'Enter') window.processUnifiedLogin && window.processUnifiedLogin()" class="w-full bg-inputBg text-xs rounded-xl pl-9 pr-10 py-3 outline-none border border-gray-300 dark:border-gray-700 focus:border-blue-500 transition font-bold text-gray-900 dark:text-white">
                        <button type="button" onclick="window.togglePasswordVisibility && window.togglePasswordVisibility('unified-login-password', 'unified-pass-eye')" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600 dark:hover:text-white transition cursor-pointer">
                            <i id="unified-pass-eye" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="button" id="unified-login-btn" onclick="window.processUnifiedLogin && window.processUnifiedLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-xs cursor-pointer mt-1">
                    <i class="fa-solid fa-right-to-bracket"></i> LOGIN
                </button>
            </div>

            <!-- Action Links -->
            <div class="flex flex-col items-center gap-2 pt-2 border-t border-gray-100 dark:border-gray-800 text-[11px] mt-1">
                <button type="button" onclick="window.toggleCustomerRegisterSection && window.toggleCustomerRegisterSection(true)" class="text-emerald-600 dark:text-emerald-400 hover:underline font-bold flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-user-plus text-xs"></i> Bagong Customer? Mag-Register Dito
                </button>
                <button type="button" onclick="window.triggerForgotPassword && window.triggerForgotPassword()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition text-[10px] cursor-pointer">
                    Nakalimutan ang Password?
                </button>
            </div>
        </div>

        <!-- 2. CUSTOMER REGISTRATION SECTION (EXPANDABLE) -->
        <div id="unified-register-section" class="hidden flex flex-col gap-3 text-center animate-fade-in">
            <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-800 pb-2">
                <div class="text-xs text-emerald-600 dark:text-emerald-400 font-extrabold uppercase tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-user-plus"></i> Customer Registration
                </div>
                <button type="button" onclick="window.toggleCustomerRegisterSection && window.toggleCustomerRegisterSection(false)" class="text-[10px] text-blue-500 hover:underline font-bold cursor-pointer">
                    ← Back to Login
                </button>
            </div>

            <!-- STEP 1: Phone Verification via SMS OTP -->
            <div id="reg-step-1" class="flex flex-col gap-3">
                <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed text-left">I-enter ang iyong 10-digit mobile number para sa OTP verification.</p>
                <div class="flex items-center bg-inputBg rounded-xl border border-gray-300 dark:border-gray-700 overflow-hidden focus-within:border-emerald-500 transition">
                    <span class="bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 font-bold px-3 py-3 text-xs font-mono select-none border-r border-gray-300 dark:border-gray-700 flex items-center gap-1 shrink-0">
                        🇵🇭 +63
                    </span>
                    <input type="tel" id="reg-phone-num" autocomplete="tel" inputmode="numeric" maxlength="10" placeholder="9XXXXXXXXX" oninput="window.sanitize10DigitPhone && window.sanitize10DigitPhone(this)" class="flex-1 bg-transparent text-xs p-3 outline-none text-gray-900 dark:text-white font-bold font-mono">
                </div>

                <button type="button" id="reg-send-otp-btn" onclick="window.sendCustomerRegisterOTP && window.sendCustomerRegisterOTP()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-xs cursor-pointer">
                    <i class="fa-solid fa-paper-plane"></i> SEND OTP CODE
                </button>

                <!-- OTP Verification Box -->
                <div id="reg-otp-box" class="hidden flex flex-col gap-3 border-t border-gray-200 dark:border-gray-800 pt-3">
                    <label class="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold uppercase text-left">Enter 6-Digit SMS Code</label>
                    <input type="text" id="reg-otp-code" autocomplete="one-time-code" inputmode="numeric" placeholder="123456" maxlength="6" class="w-full bg-inputBg text-center tracking-widest text-lg font-black rounded-xl p-3 border border-emerald-500/50 outline-none text-gray-900 dark:text-white font-mono">
                    <button type="button" id="reg-verify-otp-btn" onclick="window.verifyCustomerRegisterOTP && window.verifyCustomerRegisterOTP()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-xs cursor-pointer">
                        <i class="fa-solid fa-check-double"></i> VERIFY OTP CODE
                    </button>
                </div>
            </div>

            <!-- STEP 2: Customer Profile Details & GPS Capture -->
            <div id="reg-step-2" class="hidden flex flex-col gap-2.5 border-t border-gray-200 dark:border-gray-800 pt-3 text-left">
                <div class="text-[11px] text-emerald-600 dark:text-emerald-400 font-bold uppercase text-center mb-1">Kumpletuhin ang Iyong Detalye</div>

                <!-- Full Name (Required) -->
                <div>
                    <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Buong Pangalan *</label>
                    <input type="text" id="reg-fullname" autocomplete="name" placeholder="Buong Pangalan (Full Name)" class="w-full bg-inputBg text-xs rounded-xl p-3 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white font-bold mt-1">
                </div>

                <!-- Delivery Address (Required) -->
                <div>
                    <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Kumpletong Address *</label>
                    <input type="text" id="reg-address" autocomplete="street-address" placeholder="Kumpletong Address (Delivery Address)" class="w-full bg-inputBg text-xs rounded-xl p-3 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1">
                </div>

                <!-- GPS Location Pin (Required) -->
                <div>
                    <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Exact GPS Location Link *</label>
                    <div class="flex gap-2 mt-1">
                        <input type="text" id="reg-gps-link" readonly placeholder="Click 'Pin Location' button" class="flex-1 bg-inputBg text-xs rounded-xl p-3 border border-gray-300 dark:border-gray-700 outline-none text-emerald-500 font-mono text-[11px] truncate">
                        <button type="button" id="reg-get-gps-btn" onclick="window.captureRegistrationGPS && window.captureRegistrationGPS()" class="bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-500/50 text-emerald-600 dark:text-emerald-300 hover:text-white px-3 py-3 rounded-xl text-xs font-bold transition active:scale-95 flex items-center gap-1.5 shrink-0 cursor-pointer">
                            <i class="fa-solid fa-location-crosshairs text-sm"></i> Pin Location
                        </button>
                    </div>
                    <input type="hidden" id="reg-lat" value="0">
                    <input type="hidden" id="reg-lon" value="0">
                </div>

                <!-- Email Address (Optional) -->
                <div>
                    <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Email Address (Optional)</label>
                    <input type="email" id="reg-email" autocomplete="email" placeholder="Email Address (Optional)" class="w-full bg-inputBg text-xs rounded-xl p-3 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white mt-1">
                </div>

                <!-- Password (Required) -->
                <div>
                    <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Password *</label>
                    <div class="relative mt-1">
                        <input type="password" id="reg-password" autocomplete="new-password" placeholder="Password (min 6 characters)" class="w-full bg-inputBg text-xs rounded-xl p-3 pr-10 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white font-bold">
                        <button type="button" onclick="window.togglePasswordVisibility && window.togglePasswordVisibility('reg-password', 'reg-pass-eye')" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600 dark:hover:text-white transition cursor-pointer">
                            <i id="reg-pass-eye" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password (Required) -->
                <div>
                    <label class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase">Ulitin ang Password *</label>
                    <div class="relative mt-1">
                        <input type="password" id="reg-confirm-password" autocomplete="new-password" placeholder="Ulitin ang Password" class="w-full bg-inputBg text-xs rounded-xl p-3 pr-10 border border-gray-300 dark:border-gray-700 outline-none text-gray-900 dark:text-white font-bold">
                        <button type="button" onclick="window.togglePasswordVisibility && window.togglePasswordVisibility('reg-confirm-password', 'reg-confirm-eye')" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600 dark:hover:text-white transition cursor-pointer">
                            <i id="reg-confirm-eye" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <button type="button" id="reg-complete-btn" onclick="window.completeCustomerRegistration && window.completeCustomerRegistration()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-xs mt-2 cursor-pointer">
                    <i class="fa-solid fa-user-check"></i> REGISTER ACCOUNT
                </button>
            </div>
        </div>

        <div id="recaptcha-container" class="mx-auto"></div>
    </div>

    <!-- HIDDEN BACKWARD COMPATIBILITY INPUTS -->
    <div class="hidden">
        <input type="text" id="login-id">
        <input type="password" id="login-pass">
        <button id="login-btn"></button>
        <input type="tel" id="cust-login-phone">
        <input type="password" id="cust-login-pass">
        <button id="cust-login-submit-btn"></button>
        <input type="text" id="merch-login-user">
        <input type="password" id="merch-login-pass">
        <button id="merch-login-submit-btn"></button>
        <div id="portal-form-customer"></div>
        <div id="portal-form-rider"></div>
        <div id="portal-form-merchant"></div>
    </div>
</section>
