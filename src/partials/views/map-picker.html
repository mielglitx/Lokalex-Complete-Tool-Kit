<section id="view-map" class="hidden fixed inset-0 bg-darkBg z-[999999] flex flex-col w-full h-full overflow-hidden" style="z-index: 999999 !important;">
    <!-- HEADER -->
    <header class="bg-cardBg px-4 py-3 flex items-center justify-between shadow-md shrink-0 border-b border-gray-800 gap-2">
        <button onclick="window.goBack && window.goBack()" class="text-red-400 font-semibold flex items-center gap-1.5 transition active:opacity-50 text-xs shrink-0">
            <i class="fa-solid fa-xmark text-sm"></i> Cancel
        </button>
        <h1 id="map-view-title" class="text-sm font-bold truncate">Pick Location Pin</h1>
        <div class="w-8 shrink-0"></div>
    </header>

    <!-- GOOGLE PLACES SEARCH BAR OVERLAY -->
    <div id="map-search-bar-container" class="p-3 bg-cardBg border-b border-gray-800 z-10 shrink-0">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
            <input type="text" id="map-search-input" placeholder="Search address, store, or landmark..." class="w-full bg-inputBg text-xs text-white rounded-xl pl-9 pr-3 py-2.5 outline-none border border-gray-700 focus:border-blue-500 font-sans">
        </div>
    </div>

    <!-- MAP CONTAINER WITH FIXED CENTER MARKER PIN OVERLAY -->
    <div class="flex-1 relative w-full min-h-0 overflow-hidden">
        <div id="google-map-container" class="w-full h-full"></div>
        
        <!-- VISIBLE CENTER PIN MARKER OVERLAY -->
        <div id="map-center-pin" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-full pointer-events-none z-20 flex flex-col items-center justify-center">
            <i class="fa-solid fa-location-dot text-4xl text-red-500 drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] animate-bounce"></i>
            <div class="w-3 h-1 bg-black/60 rounded-full blur-[1px] -mt-1"></div>
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="p-3 bg-cardBg shadow-lg shrink-0 border-t border-gray-800 z-10 pb-6 sm:pb-3 flex flex-col gap-2">
        <button id="map-confirm-btn" onclick="window.confirmGoogleMapPin && window.confirmGoogleMapPin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95 text-xs flex items-center justify-center gap-2">
            <i class="fa-solid fa-location-crosshairs"></i> <span id="map-confirm-btn-text">CONFIRM LOCATION PIN</span>
        </button>
        <button id="map-nav-app-btn" onclick="window.openExternalGoogleNav && window.openExternalGoogleNav()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-xs">
            <i class="fa-solid fa-location-arrow"></i> START GOOGLE MAPS GPS NAV
        </button>
    </div>
</section>
