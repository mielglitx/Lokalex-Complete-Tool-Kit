    <!-- ULTRA-FAST ZERO-LATENCY SESSION PRE-ROUTER (INSTANT DASHBOARD PAINT) -->
    <script>
        (function() {
            try {
                var role = localStorage.getItem('lokalex_active_role');
                var riderId = localStorage.getItem('telegramId') || localStorage.getItem('riderId');
                var riderName = localStorage.getItem('riderName');
                var custFbId = localStorage.getItem('lokalex_customer_fb_id');
                var merchId = localStorage.getItem('lokalex_merchant_account_id');

                if ((riderId || riderName) && (!role || role === 'rider')) {
                    document.documentElement.classList.add('instant-session-home');
                } else if (custFbId && role === 'customer') {
                    document.documentElement.classList.add('instant-session-customer');
                } else if (merchId && role === 'merchant') {
                    document.documentElement.classList.add('instant-session-merchant');
                }
            } catch (_) {}
        })();
    </script>
    <style>
        html.instant-session-home:not(.app-mounted) #view-login { display: none !important; }
        html.instant-session-home:not(.app-mounted) #view-home:not(.hidden) { display: flex !important; }
        html.instant-session-home #view-home.hidden { display: none !important; }
        html.instant-session-customer:not(.app-mounted) #view-login { display: none !important; }
        html.instant-session-customer:not(.app-mounted) #view-customer-home:not(.hidden) { display: flex !important; }
        html.instant-session-customer #view-customer-home.hidden { display: none !important; }
        html.instant-session-merchant:not(.app-mounted) #view-login { display: none !important; }
        html.instant-session-merchant:not(.app-mounted) #view-store-hub:not(.hidden) { display: flex !important; }
        html.instant-session-merchant #view-store-hub.hidden { display: none !important; }
    </style>

    <!-- STANDALONE PWA SERVICE WORKER REGISTRATION SCRIPT -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then((reg) => {
                        console.log('Lokalex Service Worker registered with scope:', reg.scope);
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            if (newWorker) {
                                newWorker.addEventListener('statechange', () => {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        console.log('New Lokalex update installed; active on next reload.');
                                    }
                                });
                            }
                        });
                    })
                    .catch((err) => {
                        console.error('Service Worker registration failed:', err);
                    });
            });
        }
    </script>
